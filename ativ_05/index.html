
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição Completo</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    
    <style>
        /* Reset padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lora', serif;
        }

        body {
            background-color: #002138;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Container Principal */
        .caixa {
            background-color: #00355b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 550px;
        }

        .caixa h2 {
            color: #ffffff;
            font-size: 26px;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .caixa p {
            color: #ffffff;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        /* Campos de Entrada Individuais */
        .campo {
            margin-bottom: 22px;
        }

        .campo label, 
        .titulo {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        /* Estilização Geral dos inputs */
        .campo input[type="text"],
        .campo input[type="email"],
        .campo input[type="password"],
        .campo input[type="date"],
        .campo select,
        .campo textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #000000;
            border-radius: 8px;
            font-size: 15px;
            color: #000000;
            outline: none;
            background-color: #b4d9ff;
            transition: all 0.3s ease;
        }

        .campo select,
        .campo input[type="file"] {
            cursor: pointer;
        }

        .campo textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* [FOCUS] Efeito de Foco */
        .campo input:focus, 
        .campo select:focus,
        .campo textarea:focus {
            border-color: #3c3cff;
            background-color: #8ac4ff;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }

        /* Grupos de Opções */
        .grupo {
            margin-bottom: 22px;
        }

        .opcoes {
            display: flex;
            gap: 20px;
            background-color: #b4d9ff;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #000000;
        }

        .opcoes.coluna {
            flex-direction: column;
            gap: 10px;
            border: 2px solid #000000;
        }

        /* Itens das Opções */
        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #000000;
            cursor: pointer;
            
        }

        .item input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Botão */
        .botao {
            width: 100%;
            padding: 14px;
            background-color: #010d49;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        /* Efeito no botão */
        .botao:hover {
            background-color: #001998;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        .botao:active {
            transform: scale(0.99);
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .caixa {
                padding: 24px 16px;
            }
            .opcoes:not(.coluna) {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="caixa">
        <h2>Cadastro Acadêmico</h2>
        <p>Preencha todas as informações! </p>
        <form action="#" method="POST" enctype="multipart/form-data">
            
            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
            </div>

            <div class="campo">
                <label for="data-nasc">Data de Nascimento</label>
                <input type="date" id="data-nasc" name="data_nascimento" required>
            </div>

            <div class="campo">
                <label for="curso">Curso Desejado</label>
                <select id="curso" name="curso" required>
                    <option value="" disabled selected>Selecione um curso</option>
                    <option value="analise">Análise e Desenvolvimento de Sistemas</option>
                    <option value="ciencia">Ciência da Computação</option>
                    <option value="engenharia">Engenharia de Software</option>
                </select>
            </div>

            <div class="grupo">
                <span class="titulo">Sexo</span>
                <div class="opcoes">
                    <label class="item">
                        <input type="radio" name="sexo" value="masculino" required>
                        Masculino
                    </label>
                    <label class="item">
                        <input type="radio" name="sexo" value="feminino">
                        Feminino
                    </label>
                    <label class="item">
                        <input type="radio" name="sexo" value="outro">
                        Outro
                    </label>
                </div>
            </div>

            <div class="grupo">
                <span class="titulo">Áreas de Interesse</span>
                <div class="opcoes coluna">
                    <label class="item">
                        <input type="checkbox" name="interesses" value="ia">
                        Inteligência Artificial e Machine Learning
                    </label>
                    <label class="item">
                        <input type="checkbox" name="interesses" value="ciber">
                        Cibersegurança e Proteção de Dados
                    </label>
                    <label class="item">
                        <input type="checkbox" name="interesses" value="manutencao">
                        Manutenção de Sistemas e Suporte Técnico
                    </label>
                </div>
            </div>

            <div class="campo">
                <label for="foto">Foto de Perfil</label>
                <input type="file" id="foto" name="foto" accept="image/*" required>
            </div>

            <div class="campo">
                <label for="comentarios">Observações:</label>
                <textarea id="comentarios" name="comentarios" placeholder="Escreva suas observações adicionais"></textarea>
            </div>

            <button type="submit" class="botao">Enviar Inscrição</button>
        </form>
    </div>
</body>
</html>
